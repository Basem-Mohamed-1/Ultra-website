services:
  - type: web
    name: ultra-mep-website
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    startCommand: npm run start:server
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    disk:
      name: ultra-data
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /opt/render/project/src/storage/leads.sqlite
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: VITE_SITE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CONTACT_RECIPIENT
        sync: false
